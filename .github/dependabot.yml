version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # A base-image version jump is a coordinated change, not a dependency bump:
    # the Dockerfile FROM tag and requirements.lock (--python-version) have to
    # move together. Dependabot moves only the first, and it reads as noise in
    # review, which is how Python 3.14 shipped against 3.13 lockfiles elsewhere
    # in this fleet. Digest refreshes and patch bumps still flow, so security
    # rebuilds are kept.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Dependabot edits requirements.in but cannot regenerate the hash-pinned
    # requirements.lock the image installs from, so its PRs will trip the
    # lockfile drift check in CI until the lock is regenerated by hand:
    #   uv pip compile requirements.in -o requirements.lock \
    #     --generate-hashes --universal --python-version 3.13
    # That failure is the intended behaviour. It is louder than the alternative,
    # which is a green PR that silently leaves the built image on the old pin.
    commit-message:
      prefix: "deps"
