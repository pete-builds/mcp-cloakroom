version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Dependabot edits requirements.in but cannot regenerate the hash-pinned
    # requirements.lock the image installs from, so its PRs will trip the
    # lockfile drift check in CI until the lock is regenerated by hand:
    #   uv pip compile requirements.in -o requirements.lock \
    #     --generate-hashes --universal --python-version 3.13
    # That failure is the intended behaviour. It is louder than the alternative,
    # which is a green PR that silently leaves the built image on the old pin.
    commit-message:
      prefix: "deps"
