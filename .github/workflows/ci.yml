name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.in

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy clients tools server.py ingest.py

      - name: Tests with branch coverage
        # The coverage floor lives in pyproject.toml under
        # [tool.coverage.report] fail_under, so it is enforced identically here
        # and on a developer's machine.
        run: pytest

      - name: Import smoke
        run: python -c "import server, ingest; print('imports clean')"
        env:
          CLOAKROOM_AUTO_INGEST: "false"
          CLOAKROOM_DB_PATH: ":memory:"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's own
      # published checksums.txt. Verified independently before use.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v5

      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Deliberately NOT gitleaks/gitleaks-action. That action's default
      # push-event scan mode walks git history (`--log-opts=-1`, the last
      # commit only) rather than the checked-out working tree. A canary planted
      # here as a loose, uncommitted file is invisible to a history-only scan
      # regardless of whether it contains a real secret — proven locally before
      # this workflow was written: an uncommitted AWS-shaped canary produced
      # "no leaks found" under the action's default invocation. Calling the
      # gitleaks binary directly with `--no-git` scans the working tree as
      # plain files instead, which is also the more honest question for a
      # published image: does *this* checkout contain a secret, independent of
      # history. Combined with running on every push, this covers what the
      # history-walking mode was meant to provide.
      - name: Plant a positive control
        # A scanner that finds nothing is indistinguishable from a scanner that
        # is not running. This proves the job can still fail before trusting a
        # clean result on the real tree.
        #
        # NOT the AWS-documented example key (AKIAIOSFODNN7EXAMPLE /
        # wJalrXUtnFEMI...). That exact string is in gitleaks' own default
        # allowlist, so a scan that "passes" against it proves nothing --
        # confirmed locally, where it produced zero findings even under a full
        # flat-file scan. A synthetic, randomly generated token shaped like a
        # GitHub PAT (`ghp_` + 36 alnum chars) matches gitleaks' `github-pat`
        # rule by structure and entropy, is not a real credential, and is not
        # on anyone's allowlist.
        run: |
          mkdir -p .gitleaks-selftest
          token="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c36)"
          printf 'GITHUB_TOKEN=%s\n' "$token" > .gitleaks-selftest/canary.txt

      - name: Gitleaks must detect the control
        id: control
        continue-on-error: true
        run: gitleaks detect --no-git --source . --redact -v

      - name: Fail if the control was not detected
        run: |
          if [ "${{ steps.control.outcome }}" != "failure" ]; then
            echo "gitleaks did not flag the planted control; the scan is not trustworthy."
            exit 1
          fi
          echo "Positive control detected; scanner is live."
          rm -rf .gitleaks-selftest

      - name: Real scan
        run: gitleaks detect --no-git --source . --redact -v

  vulnerabilities:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy filesystem scan
        # Pinned to a commit SHA, not a tag. A tag is mutable and a tag-object
        # SHA passes CI while silently breaking Dependabot updates.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64 + arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: mcp-cloakroom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
